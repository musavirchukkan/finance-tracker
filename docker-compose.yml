services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not .../data).
      - finance_pg:/var/lib/postgresql

volumes:
  finance_pg:
